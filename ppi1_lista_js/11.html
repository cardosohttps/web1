<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 11
    </title>

    <style>
        #hoverDiv{
            width: 220px;
            height: 80px;
            border: 1px solid black;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <button id="alertButton">Clique aqui</button>
    <br><br>

    <input type="text" id="textInput" placeholder="Digite algo">
    <br><br>

    <div id="hoverDiv">Passe o mouse aqui</div>

    <br>

    <select id="colorSelect">
        <option value="">Escolha uma cor</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
    </select>

    <script>

        const botao = document.getElementById("alertButton");
        const input = document.getElementById("textInput");
        const div = document.getElementById("hoverDiv");
        const select = document.getElementById("colorSelect");


        botao.addEventListener("click", function () {
            alert("Botão clicado!");
        });

        input.addEventListener("keydown", function (event) {
            console.log("Tecla pressionada:", event.key);
        });

        input.addEventListener("focus", function () {
            input.style.backgroundColor = "yellow";
        });

        input.addEventListener("blur", function () {
            input.style.backgroundColor = "";
        });

        div.addEventListener("mouseover", function () {
            div.style.backgroundColor = "lightblue";
        });

        div.addEventListener("mouseout", function () {
            div.style.backgroundColor = "";
        });

        select.addEventListener("change", function () {
            document.body.style.backgroundColor = select.value;
        });
    </script>

</body>
</html>
