<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 12</title>
</head>
<body>

    <input type="text" id="nameInput" placeholder="Digite seu nome">
    <button id="saveButton">Salvar</button>
    <p id="greeting"></p>

    <script>
        const input = document.getElementById("nameInput");
        const botao = document.getElementById("saveButton");
        const mensagem = document.getElementById("greeting");

        let nomeSalvo = localStorage.getItem("nome");

        if (nomeSalvo) {
            mensagem.innerText = "Olá, " + nomeSalvo + "!";
            input.value = nomeSalvo;
        }

        botao.addEventListener("click", function () {
            let nome = input.value;

            localStorage.setItem("nome", nome);

            mensagem.innerText = "Olá, " + nome + "!";
        });
    </script>

</body>
</html>
