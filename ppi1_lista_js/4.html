<!DOCTYPE html>
<html lang="pt-BR" id="paginaHTML">
<head id="cabecalhoPagina">
    <meta charset="UTF-8" id="codificacao">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="viewport">
    <title id="tituloAba">Calculadora de IMC</title>

    <style id="estiloPagina">
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        main {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        #imgPerfil {
            display: none;
            width: 180px;
            margin: 20px auto 0;
        }
    </style>
</head>

<body id="corpoPagina">
    <main id="conteudoPrincipal">
        <h1 id="tituloPrincipal">Calculadora de IMC</h1>

        <label for="nome" id="labelNome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="peso" id="labelPeso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Exemplo: 70.5">

        <label for="altura" id="labelAltura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" placeholder="Exemplo: 1.75">

        <button id="botaoCalcular" onclick="calcularIMC()">Calcular</button>

        <p id="resultadoIMC"></p>
        <p id="classificacao"></p>

        <img id="imgPerfil" src="" alt="Imagem do perfil de saúde">
    </main>

    <script id="codigoJavaScript">
        function calcularIMC() {
            const nome = document.getElementById("nome").value.trim();
            const peso = parseFloat(document.getElementById("peso").value);
            const altura = parseFloat(document.getElementById("altura").value);

            const resultadoIMC = document.getElementById("resultadoIMC");
            const classificacao = document.getElementById("classificacao");
            const imgPerfil = document.getElementById("imgPerfil");

            if (nome === "" || isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                alert("Preencha corretamente o nome, o peso e a altura.");
                resultadoIMC.innerHTML = "";
                classificacao.innerHTML = "";
                imgPerfil.style.display = "none";
                return;
            }

            const imc = peso / (altura * altura);
            const imcExibido = imc.toFixed(2);

            let textoClassificacao = "";

            if (imc < 18.5) {
                textoClassificacao = "Abaixo do peso";
            } else if (imc < 25) {
                textoClassificacao = "Peso normal";
            } else if (imc < 30) {
                textoClassificacao = "Sobrepeso";
            } else if (imc < 35) {
                textoClassificacao = "Obesidade grau 1";
            } else if (imc < 40) {
                textoClassificacao = "Obesidade grau 2";
            } else {
                textoClassificacao = "Obesidade grau 3 (mórbida)";
            }

            resultadoIMC.innerHTML = nome + ", seu IMC é: <strong>" + imcExibido + "</strong>";
            classificacao.innerHTML = "Classificação: <strong>" + textoClassificacao + "</strong>";

            const faixaIMC = Math.floor(imc);

            switch (faixaIMC) {
                case 0:
                case 1:
                case 2:
                case 3:
                case 4:
                case 5:
                case 6:
                case 7:
                case 8:
                case 9:
                case 10:
                case 11:
                case 12:
                case 13:
                case 14:
                case 15:
                case 16:
                case 17:
                    imgPerfil.src = "./imgs/magro.png";
                    break;

                case 18:
                    if (imc < 18.5) {
                        imgPerfil.src = "./imgs/magro.png";
                    } else {
                        imgPerfil.src = "./imgs/normal.png";
                    }
                    break;

                case 19:
                case 20:
                case 21:
                case 22:
                case 23:
                case 24:
                    imgPerfil.src = "./imgs/normal.png";
                    break;

                case 25:
                case 26:
                case 27:
                case 28:
                case 29:
                    imgPerfil.src = "./imgs/sobrepeso.png";
                    break;

                case 30:
                case 31:
                case 32:
                case 33:
                case 34:
                    imgPerfil.src = "./imgs/obeso1.png";
                    break;

                case 35:
                case 36:
                case 37:
                case 38:
                case 39:
                    imgPerfil.src = "./imgs/obeso2.png";
                    break;

                default:
                    imgPerfil.src = "./imgs/obeso3.png";
                    break;
            }

            imgPerfil.style.display = "block";
        }
    </script>
</body>
</html>
