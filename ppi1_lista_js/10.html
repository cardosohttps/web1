<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 10</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .calculadora{
            width: 250px;
            padding: 15px;
            background-color: #333;
            border-radius: 10px;
        }

        #display{
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .botoes{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        button{
            height: 50px;
            font-size: 20px;
            cursor: pointer;
        }

        .igual{
            grid-column: span 4;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="display" readonly>

        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="adicionar('/')">/</button>
            <button onclick="adicionar('*')">*</button>
            <button onclick="apagar()">←</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('-')">-</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('+')">+</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button onclick="adicionar('.')">.</button>

            <button onclick="adicionar('0')">0</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        function adicionar(valor){
            document.getElementById("display").value += valor;
        }

        function limpar(){
            document.getElementById("display").value = "";
        }

        function apagar(){
            let display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }

        function calcular(){
            let display = document.getElementById("display");

            try{
                display.value = eval(display.value);
            }catch{
                display.value = "Erro";
            }
        }
    </script>

</body>
</html>
